<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SONNA - Cửa hàng acc Dragon Ball Legends</title>
<link rel="icon" type="image/svg+xml" href="/sonna-mark.svg">
<style>
html,body{margin:0;height:100%;background:#0F1320;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#EAEFFA}
body{display:flex;flex-direction:column}
#bar{flex:none;background:#171C2B;border-bottom:1px solid #2B3248;padding:6px 10px;display:none;flex-wrap:wrap;gap:6px 12px;align-items:center}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
.grp b{font-size:11px;letter-spacing:.08em;color:#A3ACC4;margin-right:4px}
button{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid #2B3248;background:transparent;color:#EAEFFA;font:inherit;font-size:13px;cursor:pointer}
button[aria-current="page"]{background:#FF8A1F;color:#1A1206;border-color:#FF8A1F;font-weight:600}
button:focus-visible{outline:2px solid #52C7FF;outline-offset:2px}
#note{margin-left:auto;font-size:12px;color:#A3ACC4}
#bar[data-page^="Admin"] #resetData,#bar[data-page^="Admin"] #note{display:none}
#community-nav{flex:none;display:flex;align-items:center;gap:8px;padding:8px 16px;background:#24143d;border-bottom:1px solid #392653}
#community-nav strong{margin-right:8px;color:#fff;font-size:14px;letter-spacing:.12em}
#community-nav a{display:inline-flex;align-items:center;min-height:36px;padding:0 13px;border:1px solid #5a4670;border-radius:8px;color:#f6f0fc;text-decoration:none;font-size:13px;font-weight:600}
#community-nav a:hover,#community-nav a:focus-visible{border-color:#ff8a1f;color:#ffc24b;outline:none}
#community-nav .community-link{margin-left:auto;border-color:#ff8a1f;background:#ff8a1f;color:#24143d}
#community-nav .community-link:hover,#community-nav .community-link:focus-visible{background:#ffc24b;color:#24143d}
iframe{flex:1;border:0;width:100%;background:#0F1320}
#login{flex:1;display:none;align-items:center;justify-content:center;padding:24px;background:#0F1320}
#login form{width:100%;max-width:380px;background:#171C2B;border:1px solid #2B3248;border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px}
#login h1{margin:0;font-size:28px;letter-spacing:.06em}
#login label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:#A3ACC4}
#login input{min-height:46px;padding:0 12px;border-radius:8px;border:1px solid #2B3248;background:#0F1320;color:#EAEFFA;font-size:16px;font-family:inherit}
#login input:focus-visible{outline:2px solid #52C7FF;outline-offset:2px}
#login .go{min-height:48px;border:0;border-radius:8px;background:#FF8A1F;color:#1A1206;font-size:16px;font-weight:700}
#login .hint{font-size:13px;color:#A3ACC4}
#login .err{font-size:14px;color:#FF9AA5}
</style>
</head>
<body>
<div id="bar" role="navigation" aria-label="Chọn màn hình"></div>
<nav id="community-nav" aria-label="Điều hướng SONNA">
<strong>SONNA</strong>
<a href="#Store">Cửa hàng</a>
<a href="/community.html?login=1">Đăng nhập</a>
<a class="community-link" href="/community.html">Diễn đàn &amp; Chợ thành viên</a>
</nav>
<iframe id="f" title="Màn hình thiết kế"></iframe>
<div id="login"><form id="lf" autocomplete="off">
<h1>SONNA ADMIN</h1>
<label>Tên đăng nhập<input id="lu" type="text" autocomplete="off"></label>
<label>Mật khẩu<input id="lp" type="password" autocomplete="off"></label>
<span id="le" class="err" role="alert"></span>
<button class="go" type="submit">Đăng nhập quản trị</button>
<span class="hint">Đăng nhập được kiểm tra ở máy chủ.</span>
</form></div>
<script src="app.js"></script>
</body>
</html>
