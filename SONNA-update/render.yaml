services:
  - type: web
    name: sonna
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: sonna-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
